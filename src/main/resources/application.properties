spring.application.name=XChange
spring.datasource.url=jdbc:postgresql://localhost:5432/${XCHANGE_DB_NAME}?reWriteBatchedInserts=true
spring.datasource.username=${XCHANGE_DB_USER}
spring.datasource.password=${XCHANGE_DB_USER_PASSWORD}

# (Optional) Since you have Flyway in your pom.xml, disable it for now so it doesn't conflict
spring.flyway.enabled=false
